name: SSH into Runner

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v4

      - name: Install sshx
        run: curl -sSf https://sshx.io/get | sh

      - name: Start sshx
        run: sshx --name gh-runner