name: SSH into Runner

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v4

      # ========== 1) 还原上次缓存 ==========
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: $HOME
          key: ssh-home-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ssh-home-${{ github.ref_name }}-
            ssh-home-

      # ========== 2) 安装 sshx ==========
      - name: Install sshx
        run: curl -sSf https://sshx.io/get | sh

      # ========== 3) 启动 sshx（比 job 超时短 1 分钟） ==========
      - name: Start sshx (auto-exit 1 min before job timeout)
        run: timeout 359m sshx --name gh-runner || true

      # ========== 4) 保存缓存 ==========
      - name: Save cache
        if: always()
        uses: actions/cache@v4
        with:
          path: $HOME
          key: ssh-home-${{ github.ref_name }}-${{ github.run_id }}-save
          restore-keys: |
            ssh-home-${{ github.ref_name }}-