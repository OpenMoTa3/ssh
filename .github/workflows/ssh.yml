name: SSH into Runner

on:
  workflow_dispatch:        # 只能手动触发,不要用 push/PR

jobs:
  ssh:
    runs-on: ubuntu-22.04   # 关键:别用 ubuntu-latest(现在指向 26.04 预览版)
    steps:
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false   # 只允许触发者连接
        timeout-minutes: 30